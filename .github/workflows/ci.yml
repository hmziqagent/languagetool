# CI skeleton for OpenGrammar-RS (plans/07: run `cargo test --workspace`;
# parity gates against the Java LanguageTool server come later).
#
# Note: the read-only `languagetool/` reference checkout is not part of the
# repository, so CI runs without LanguageTool resources. Data-backed rules
# degrade to empty data and tests that need real resources skip themselves,
# so the suite is expected to stay green either way.

name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      # Kept warning-level (no `-D warnings`): the workspace carries a
      # pre-existing baseline of ~180 warning-level clippy lints spread over
      # 9 crates (most: og-langs 51, og-test-runner 32, og-rules 29,
      # og-tagger 28, og-xml 24; dominated by clippy::collapsible_if —
      # og-compat's cast_abs_to_unsigned is just 2 of them). Tighten to
      # `-- -D warnings` only after that whole baseline is fixed.
      - name: clippy
        run: cargo clippy --workspace

      - name: tests
        run: cargo test --workspace
